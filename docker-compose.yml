version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: yelp-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yelp_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-yelp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yelp_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database_dump.sql:/docker-entrypoint-initdb.d/01-restore.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yelp_user} -d ${POSTGRES_DB:-yelp_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yelp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yelp-analytics-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yelp_user}:${POSTGRES_PASSWORD:-yelp_password}@postgres:5432/${POSTGRES_DB:-yelp_analytics}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yelp_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-yelp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yelp_password}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yelp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yelp-analytics-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - yelp-network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yelp-analytics-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@yelp-analytics.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - yelp-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  yelp-network:
    driver: bridge
